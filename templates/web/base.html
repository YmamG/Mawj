{% load static mawj %}<!DOCTYPE html><html lang="{{ lang }}" dir="{% if lang == 'ar' %}rtl{% else %}ltr{% endif %}" data-theme="{{ theme }}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% if lang == 'ar' %}موج{% else %}Mawj{% endif %}</title><meta name="description" content="Journal, organize tasks, and see your progress with Mawj."><link rel="icon" href="{% static 'web/icon.svg' %}"><link rel="stylesheet" href="{% static 'web/fonts.css' %}"><link rel="stylesheet" href="{% static 'web/style.css' %}"><script>try{document.documentElement.dataset.theme=localStorage.getItem('mawj-theme')||document.documentElement.dataset.theme}catch{}</script></head><body><a href="#main" class="skip-link">{% tr 'Skip to content' %}</a>{% block content %}{% endblock %}{{ boot|json_script:'mawj-boot' }}{% csrf_token %}<script defer src="{% static 'web/app.js' %}"></script></body></html>
