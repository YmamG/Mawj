{% load mawj %}
{% if compact %}<div class="compact-appearance"><details class="appearance-menu"><summary class="appearance-trigger" aria-label="{% tr 'Choose a theme' %}" title="{% tr 'Choose a theme' %}">{% icon 'Sun' %}</summary><div class="appearance-popover"><strong>{% tr 'Choose a theme' %}</strong><div class="theme-picker" role="group" aria-label="{% tr 'Choose a theme' %}">{% for id,label in themes %}<button type="button" class="theme-dot {{ id }}" data-theme-choice="{{ id }}" title="{% tr label %}" aria-label="{% tr label %}" aria-pressed="{% if theme == id %}true{% else %}false{% endif %}"><span></span></button>{% endfor %}</div></div></details><button class="language-icon-toggle" type="button" data-language="{% if lang == 'ar' %}en{% else %}ar{% endif %}" aria-label="{% if lang == 'ar' %}{% tr 'Switch to English' %}{% else %}Switch to Arabic{% endif %}" title="{% if lang == 'ar' %}{% tr 'Switch to English' %}{% else %}Switch to Arabic{% endif %}">{% icon 'Globe' %}</button></div>{% else %}<div class="appearance-controls"><div class="theme-picker" role="group" aria-label="{% tr 'Choose a theme' %}">{% for id,label in themes %}<button type="button" class="theme-dot {{ id }}" data-theme-choice="{{ id }}" title="{% tr label %}" aria-label="{% tr label %}" aria-pressed="{% if theme == id %}true{% else %}false{% endif %}"><span></span></button>{% endfor %}</div><button class="language-toggle" type="button" data-language="{% if lang == 'ar' %}en{% else %}ar{% endif %}">{% if lang == 'ar' %}English{% else %}العربية{% endif %}</button></div>{% endif %}
