{% load mawj %}
{% if compact %}<details class="appearance-menu"><summary class="appearance-trigger" aria-label="{% tr 'Appearance and language' %}" title="{% tr 'Appearance and language' %}">{% icon 'Sun' %}</summary><div class="appearance-popover"><strong>{% tr 'Choose a theme' %}</strong><div class="theme-picker" role="group" aria-label="{% tr 'Choose a theme' %}">{% for id,label in themes %}<button type="button" class="theme-dot {{ id }}" data-theme-choice="{{ id }}" title="{% tr label %}" aria-label="{% tr label %}" aria-pressed="{% if theme == id %}true{% else %}false{% endif %}"><span></span></button>{% endfor %}</div><button class="language-toggle" type="button" data-language="{% if lang == 'ar' %}en{% else %}ar{% endif %}">{% if lang == 'ar' %}English{% else %}العربية{% endif %}</button></div></details>{% else %}<div class="appearance-controls"><div class="theme-picker" role="group" aria-label="{% tr 'Choose a theme' %}">{% for id,label in themes %}<button type="button" class="theme-dot {{ id }}" data-theme-choice="{{ id }}" title="{% tr label %}" aria-label="{% tr label %}" aria-pressed="{% if theme == id %}true{% else %}false{% endif %}"><span></span></button>{% endfor %}</div><button class="language-toggle" type="button" data-language="{% if lang == 'ar' %}en{% else %}ar{% endif %}">{% if lang == 'ar' %}English{% else %}العربية{% endif %}</button></div>{% endif %}
