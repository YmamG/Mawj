{% load mawj %}{% if data.pages > 1 %}<nav class="pagination" aria-label="{% tr 'Pagination' %}">{% if data.page > 1 %}<a class="button secondary" href="?{{ pagination_query }}&page={{ data.page|decrement }}">{% tr 'Previous' %}</a>{% endif %}<span>{% tr 'Page' %} {{ data.page }} {% tr 'of' %} {{ data.pages }}</span>{% if data.page < data.pages %}<a class="button secondary" href="?{{ pagination_query }}&page={{ data.page|increment }}">{% tr 'Next' %}</a>{% endif %}</nav>{% endif %}
