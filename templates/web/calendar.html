{% load mawj %}<div class="calendar-toolbar"><button class="icon-button" data-month="-1" aria-label="{% tr 'Previous month' %}">{% icon 'CaretLeft' %}</button><h2 data-month-title>{{ month_heading }}</h2><button class="icon-button" data-month="1" aria-label="{% tr 'Next month' %}">{% icon 'CaretRight' %}</button></div><div class="calendar-weekdays">{% for day in weekdays %}<span>{% tr day %}</span>{% endfor %}</div><div class="calendar-grid">{% for blank in calendar_offset %}<span class="calendar-empty"></span>{% endfor %}{% for day in data.days %}<button class="calendar-day {% if day.date == today %}is-today{% endif %}" data-day="{{ day.date }}" aria-label="{{ day.date }}"><span class="day-number">{{ day.day }}</span>{% if day.total %}<span class="day-tasks">{{ day.completed }}/{{ day.total }} {% tr 'done' %}</span>{% endif %}{% if day.has_journal %}<span class="day-journal">{% icon 'Notebook' %}</span>{% endif %}</button>{% endfor %}</div>
