{% load mawj %}<section class="compose-panel journal-compose" id="journal-compose" hidden><span class="journal-binding" aria-hidden="true"></span><header class="compose-heading"><div><span class="eyebrow">{% tr 'My journal' %}</span><h2>{% tr 'A new entry' %}</h2></div><button class="icon-button" data-close-compose="journal-compose" aria-label="{% tr 'Close journal form' %}">{% icon 'X' %}</button></header><form id="journal-form"><div class="field"><label class="sr-only" for="journal-text">{% tr 'Your thoughts' %}</label><textarea id="journal-text" name="raw_text" required rows="10" dir="auto" placeholder="{% tr 'What is on your mind today?' %}"></textarea></div><div class="form-actions"><button class="button">{% icon 'BookOpenText' %}{% tr 'Save entry' %}</button><button type="button" class="text-link" data-close-compose="journal-compose">{% tr 'Cancel' %}</button><span class="journal-private-hint">{% icon 'ShieldCheck' %}{% tr 'Private to your account' %}</span></div></form></section><section class="entry-detail" id="journal-detail" hidden></section>
