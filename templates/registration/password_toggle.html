<label class="password-toggle" hidden><input type="checkbox" id="show-password"> Show password</label>
<script>
    (() => {
        const toggle = document.getElementById('show-password');
        toggle.parentElement.hidden = false;
        const fields = Array.from(toggle.closest('form').querySelectorAll('input[type="password"]'));
        toggle.addEventListener('change', () => {
            fields.forEach(field => { field.type = toggle.checked ? 'text' : 'password'; });
        });
    })();
</script>
