{% extends "base.html" %}
{% block title %}Delete Entry - Mawj{% endblock %}
{% block content %}
<h1>Delete Journal Entry</h1>
<p>Delete this entry and all its suggestions? Tasks you already accepted will remain. This cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'journal_detail' entry.pk %}">Cancel</a>
</form>
{% endblock %}
